<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corridas 2027 | Assessoria Thelio Tri</title>
<style>
:root{--bg:#0d0d0d;--card:#1a1a17;--ink:#f3f0e6;--muted:#a79f8b;--line:#3d3718;--accent:#f5b800;--accent-ink:#111}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:46px;width:auto}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS",Verdana,sans-serif}
a{color:inherit}
header{background:#000;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:8px}
header b{font:400 27px/1 Impact,"Arial Narrow",sans-serif;letter-spacing:1.5px;color:var(--accent);text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 0 6px rgba(245,184,0,.35)}
nav a{margin-left:16px;text-decoration:none;font-weight:700}
main{max-width:960px;margin:0 auto;padding:24px 20px 60px}
h1,h2,h3{font-family:Impact,"Arial Narrow",sans-serif;font-weight:400;letter-spacing:.3px;margin:0 0 10px}
h1{font-size:clamp(34px,7vw,56px);line-height:1}
.lead{color:var(--muted);max-width:52ch;margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.ev{background:var(--card);border:1px solid var(--line);text-decoration:none;display:block}
.flyer{aspect-ratio:2/3;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;color:#fff;background-size:cover;background-position:center}
.flyer .d{font:400 44px/1 Impact,sans-serif}
.flyer .n{font-weight:700}
.ev .meta{padding:12px 14px;font-size:14px}
.ev .meta strong{display:block;font-size:16px}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:0;padding:12px 22px;font:700 15px inherit;font-family:inherit;cursor:pointer;text-decoration:none}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.two{display:grid;grid-template-columns:minmax(0,400px) 1fr;gap:28px;align-items:start}
@media(max-width:720px){.two{grid-template-columns:1fr}}
dl{margin:0;display:grid;grid-template-columns:110px 1fr;gap:8px 12px;border-top:1px dashed var(--line);padding-top:12px}
dt{color:var(--muted)}dd{margin:0;font-weight:700}
.box{background:var(--card);border:1px solid var(--line);padding:18px;margin-top:20px}
.pk{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.pk input{margin-right:10px}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 4px}
input[type=text],input[type=email],input[type=password],select{width:100%;padding:11px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
.pix{font:700 17px/1.3 monospace;word-break:break-all;background:var(--bg);border:1px dashed var(--ink);padding:12px;margin:10px 0}
.total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin:16px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.wrap{overflow-x:auto}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin:12px 0}
.count div{background:var(--bg);border:1px solid var(--line);padding:10px 2px}
.count b{display:block;font:400 30px/1 Impact,sans-serif;color:var(--accent)}
.count small{color:var(--muted);font-size:11px}
.cd{padding:10px 12px;background:#000;border-bottom:1px solid var(--line);text-align:center;min-height:86px}.cd>small{display:block;color:var(--accent);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px}.cd .count{margin:6px 0 0;gap:6px}.cd .count div{padding:6px 2px}.cd .count b{font-size:24px}
.comp dl{grid-template-columns:130px 1fr}.pend{border-color:var(--accent)}
@media print{header,.back,.noprint,form,.lead{display:none!important}body,main{background:#fff!important;color:#000!important}.box{background:#fff!important;color:#000!important;border:1px solid #000!important;break-inside:avoid}dt,.warn{color:#333!important}h1{color:#000}}
.btn.sm{padding:6px 12px;font-size:13px}
.back{display:inline-block;margin-bottom:14px;font-weight:700}
.warn{font-size:13px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<header><a class="logo" href="#"><img src="logo.jpg" alt=""><b id="brand"></b></a><nav><a href="#">Eventos</a><a href="#comprovante">Comprovante</a></nav></header>
<main id="app"></main>

<script>
/* ============ 1) EDITE AQUI ============ */
const CONFIG = {
  nome: "Assessoria Thelio Tri",
  whatsapp: "5591986451840",          // DDI+DDD+número, só dígitos
  pixChave: "Thtrindade12@gmail.com",
  pixBanco: "Bradesco",
  pixNome: "Thelio Trindade de Moraes",
  urlPlanilha: "https://script.google.com/macros/s/AKfycbxJHdTSbkT4sLDxXl5s7serkGPejfUv_XOSorM7sDWyCEuzJfBsYkzrlZiCUDJ3yx2U/exec",  // URL do app da Web do Google Apps Script (termina em /exec)
  modoTeste: true                     // true = libera o formulário mesmo fora do prazo (use só para testar; volte para false ao publicar)
};
/* flyer: coloque a imagem na mesma pasta do index.html e informe só o nome do arquivo. Sem imagem, aparece um bloco colorido. */
const EVENTOS = [
  {id:"niver-rafa", nome:"Niver do Rafa", data:"2027-01-24", local:"Guarumã", cor:"#2a2410"},
  {id:"niver-thelio-tri", nome:"Niver Thelio Tri", data:"2027-04-18", hora:"06:00", concentracao:"05:30", local:"Praça Matriz, Acará", org:"Assessoria Thelio Tri", abre:"2026-12-01T08:00:00-03:00", fecha:"2027-04-16T23:59:00-03:00", flyer:"flyer-niver-thelio-tri.jpg", cor:"#2a2410",
   premiacao:"5 primeiros da classificação geral e Top 10 da categoria feminina, com dinheiro e brindes.",
   premios:{geral:["R$ 300","R$ 200","R$ 100","R$ 50","R$ 50"], top10:["R$ 100","R$ 100","R$ 100","R$ 100","R$ 100","Brinde","Brinde","Brinde","Brinde","Brinde"]},
   sobre:"Corrida de 5 km em comemoração ao aniversário do Thelio Tri. O kit inclui camisa, medalha e carbo gel.",
   categorias:["5 km Masculino","5 km Feminino"],
   pacotes:[{n:"Kit completo",p:80,d:"Camisa, medalha e carbo gel"}]},
  {id:"corrida-kids", nome:"Corrida Kids", data:"2027-07-11", local:"Acará", cor:"#2a2410"},
  {id:"corrida-verao", nome:"Corrida de Verão", data:"2027-07-25", local:"Acará", cor:"#2a2410"},
  {id:"corrida-mata", nome:"Corrida da Mata", data:"2027-09-12", local:"Acará", cor:"#2a2410"},
  {id:"reis-rainhas", nome:"Reis e Rainhas", data:"2027-11-07", local:"Acará", cor:"#2a2410"},
  {id:"corrida-bem", nome:"Corrida do Bem", data:"2027-12-12", local:"Acará", cor:"#2a2410"}
];
const $=s=>document.querySelector(s), app=$("#app");
const brl=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const dt=d=>new Date(d+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const sh=d=>new Date(d+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"short"}).replace(".","");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
$("#brand").textContent=CONFIG.nome;

function flyer(e){const bg=e.flyer?`background-image:url('${e.flyer}')`:`background:${e.cor}`;
  return `<div class="flyer" style="${bg}">${e.flyer?"":`<span class="d">${sh(e.data)}</span><span class="n">${esc(e.nome)}</span>`}</div>`}

function home(){
  app.innerHTML=`<h1>Corridas de 2027</h1><p class="lead">Escolha a prova, veja os detalhes e faça sua inscrição em poucos minutos.</p>
  <div class="grid">${EVENTOS.map(e=>`<a class="ev" href="#evento/${e.id}"><div class="cd" data-id="${e.id}">${cd(e)}</div>${flyer(e)}<div class="meta"><strong>${esc(e.nome)}</strong>${dt(e.data)}<br>${esc(e.local)}${e.pacotes?"":"<br><small>Detalhes em breve</small>"}</div></a>`).join("")}</div>`;
  clearInterval(window._t);
  window._t=setInterval(()=>document.querySelectorAll(".cd[data-id]").forEach(el=>{const e=EVENTOS.find(x=>x.id===el.dataset.id);if(e)el.innerHTML=cd(e)}),1000);
}

function premios(p){const t=(tit,l)=>`<div><h3>${tit}</h3><table>${l.map((v,i)=>`<tr><td>${i+1}º lugar</td><td><b>${v}</b></td></tr>`).join("")}</table></div>`;
  return `<div class="box"><h2>Premiação</h2><div class="row">${t("5 primeiros (geral)",p.geral)}${t("Top 10 feminino",p.top10)}</div></div>`}

function evento(id){
  const e=EVENTOS.find(x=>x.id===id); if(!e) return home();
  if(!e.pacotes){app.innerHTML=`<a class="back" href="#">‹ Todos os eventos</a><div class="two"><div>${flyer(e)}</div><div><h1>${esc(e.nome)}</h1><dl><dt>Data</dt><dd>${dt(e.data)}</dd><dt>Local</dt><dd>${esc(e.local)}</dd></dl><p>Flyer, valores e inscrições serão divulgados em breve.</p></div></div>`;return}
  app.innerHTML=`<a class="back" href="#">‹ Todos os eventos</a>
  <div class="two"><div>${flyer(e)}</div><div>
    <h1>${esc(e.nome)}</h1>
    <dl><dt>Data</dt><dd>${dt(e.data)}</dd><dt>Concentração</dt><dd>${e.concentracao}</dd><dt>Largada</dt><dd>${e.hora}</dd><dt>Local</dt><dd>${esc(e.local)}</dd><dt>Organização</dt><dd>${esc(e.org)}</dd><dt>Premiação</dt><dd>${esc(e.premiacao)}</dd></dl>
    <p>${esc(e.sobre)}</p></div></div>
  ${e.premios?premios(e.premios):""}
  <form class="box" id="f" novalidate><h2>Inscrição</h2>
    <div class="row"><div><label for="nome">Nome</label><input type="text" id="nome" required></div><div><label for="sob">Sobrenome</label><input type="text" id="sob" required></div></div>
    <label for="email">E-mail</label><input type="email" id="email" required>
    <div class="row"><div><label for="cpf">CPF</label><input type="text" id="cpf" inputmode="numeric" required></div><div><label for="cel">Celular com DDD</label><input type="text" id="cel" inputmode="tel" placeholder="91999998888" required></div></div>
    <div class="row"><div><label for="gen">Gênero</label><select id="gen"><option>Masculino</option><option>Feminino</option></select></div>
    <div><label for="cat">Categoria</label><select id="cat">${e.categorias.map(c=>`<option>${esc(c)}</option>`).join("")}</select></div></div>
    <label for="cam">Tamanho da camisa</label><select id="cam">${["PP","P","M","G","GG"].map(t=>`<option>${t}</option>`).join("")}</select>
    <label>Pacote</label>${e.pacotes.map((p,i)=>`<label class="pk"><span><input type="radio" name="pk" value="${i}" ${i?"":"checked"}>${esc(p.n)}<br><small>${esc(p.d)}</small></span><b>${brl(p.p)}</b></label>`).join("")}
    <div class="total"><span>Total</span><span id="tot"></span></div>
    <p class="warn" id="err" role="alert"></p>
    <button class="btn" type="submit">Finalizar inscrição</button></form>`;
  const upd=()=>{const i=+document.querySelector("input[name=pk]:checked").value;$("#tot").textContent=brl(e.pacotes[i].p)};
  app.querySelectorAll("input[name=pk]").forEach(r=>r.onchange=upd);upd();
  $("#f").onsubmit=async ev=>{ev.preventDefault();
    if(e.abre&&!CONFIG.modoTeste){const n=new Date();if(n<new Date(e.abre)||n>=new Date(e.fecha)){$("#err").textContent="As inscrições não estão abertas no momento.";return}}
    const v=id=>$("#"+id).value.trim(), cpf=v("cpf").replace(/\D/g,""), cel=v("cel").replace(/\D/g,"");
    if(!v("nome")||!v("sob")||!/.+@.+\..+/.test(v("email"))||cpf.length!==11||cel.length<10){$("#err").textContent="Preencha todos os campos. CPF com 11 dígitos e celular com DDD.";return}
    if(!/^https:\/\/script\.google\.com\//.test(CONFIG.urlPlanilha)){$("#err").textContent="Inscrições ainda não configuradas. Avise o organizador.";return}
    const p=e.pacotes[+document.querySelector("input[name=pk]:checked").value];
    const r={evento:e.nome,nome:v("nome")+" "+v("sob"),email:v("email"),cpf,cel,genero:v("gen"),categoria:v("cat"),camisa:v("cam"),pacote:p.n,valor:p.p,em:new Date().toLocaleString("pt-BR")};
    const btn=ev.target.querySelector("button[type=submit]"),volta=m=>{$("#err").textContent=m;btn.disabled=false;btn.textContent="Finalizar inscrição"};
    btn.disabled=true;btn.textContent="Enviando...";$("#err").textContent="";
    try{
      const res=await fetch(CONFIG.urlPlanilha,{method:"POST",body:JSON.stringify(r)});
      const j=await res.json();
      if(!j.ok){volta(j.erro||"Não foi possível registrar a inscrição.");return}
    }catch(x){volta("Não foi possível enviar a inscrição. Verifique a internet e tente novamente.");return}
    pagar(e,r);scrollTo(0,0)};
  janela(e);
}

function falta(n,t){
  let s=Math.max(0,Math.floor((t-n)/1000));
  const d=Math.floor(s/86400);s%=86400;const h=Math.floor(s/3600);s%=3600;
  return [d,h,Math.floor(s/60),s%60];
}
function cd(e){
  if(!e.abre||!e.fecha)return "<small>Inscrições em breve</small>";
  const n=new Date(),ab=new Date(e.abre),fe=new Date(e.fecha);
  if(n>=fe)return "<small>Inscrições encerradas</small>";
  const antes=n<ab,v=falta(n,antes?ab:fe),nm=["dias","horas","min","seg"];
  return `<small>${antes?"Inscrições abrem em":"Inscrições encerram em"}</small><div class="count">${v.map((x,i)=>`<div><b>${String(x).padStart(2,"0")}</b><small>${nm[i]}</small></div>`).join("")}</div>`;
}
function janela(e){
  clearInterval(window._t);
  if(!e.abre||!e.fecha)return;
  const ab=new Date(e.abre),fe=new Date(e.fecha),f=$("#f"),box=document.createElement("div");
  box.className="box";f.before(box);
  const fmt=d=>d.toLocaleString("pt-BR",{dateStyle:"long",timeStyle:"short"});
  let est=null;
  const tick=()=>{
    const n=new Date(),st=n<ab?"antes":n<fe?"aberta":"fim";
    if(est&&st!==est){evento(e.id);return}
    if(!est&&st!=="aberta"&&!CONFIG.modoTeste)f.remove();
    est=st;
    if(st==="fim"){box.innerHTML="<h2>Inscrições encerradas</h2><p>O prazo de inscrição desta corrida terminou.</p>";clearInterval(window._t);return}
    const v=falta(n,st==="antes"?ab:fe),nm=["dias","horas","minutos","segundos"];
    box.innerHTML=`<h2>${st==="antes"?"As inscrições abrem em":"As inscrições encerram em"}</h2>
    <div class="count" role="timer">${v.map((x,i)=>`<div><b>${String(x).padStart(2,"0")}</b><small>${nm[i]}</small></div>`).join("")}</div>
    <p class="warn">${st==="antes"?"Abertura: "+fmt(ab):"Encerramento: "+fmt(fe)}</p>`;
  };
  tick();window._t=setInterval(tick,1000);
}

function pagar(e,r){
  const msg=encodeURIComponent(`Olá! Segue o comprovante da inscrição de ${r.nome} na ${e.nome} (${r.categoria}, camisa ${r.camisa}, ${r.pacote} - ${brl(r.valor)}).`);
  app.innerHTML=`<h1>Inscrição recebida</h1><p class="lead">${esc(r.nome)}, falta só o pagamento para confirmar sua vaga em ${esc(e.nome)}.</p>
  <div class="box"><h2>1. Pague com PIX</h2><div class="total"><span>Valor</span><span>${brl(r.valor)}</span></div>
  <div>Chave PIX</div><div class="pix" id="pix">${esc(CONFIG.pixChave)}</div><div>Recebedor: <b>${esc(CONFIG.pixNome)}</b></div><div>Banco: <b>${esc(CONFIG.pixBanco)}</b></div><br>
  <button class="btn alt" id="cp">Copiar chave PIX</button></div>
  <div class="box"><h2>2. Envie o comprovante</h2><p>Depois de pagar, mande o comprovante para o organizador no WhatsApp.</p>
  <a class="btn" target="_blank" rel="noopener" href="https://wa.me/${CONFIG.whatsapp}?text=${msg}">Enviar comprovante no WhatsApp</a></div>
  <p class="warn">Depois que a organização confirmar o pagamento, seu comprovante de inscrição fica disponível em <a href="#comprovante">Comprovante</a>, com seu CPF e e-mail.</p>
  <p><a class="back" href="#">‹ Voltar aos eventos</a></p>`;
  $("#cp").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(CONFIG.pixChave).then(()=>$("#cp").textContent="Chave copiada")};
}

function comprovante(){
  app.innerHTML=`<a class="back" href="#">‹ Todos os eventos</a><h1>Comprovante de inscrição</h1><p class="lead">Informe o CPF e o e-mail usados na inscrição. O comprovante é liberado depois que a organização confirmar o seu pagamento.</p>
  <form class="box noprint" id="cf" novalidate><label for="ccpf">CPF</label><input type="text" id="ccpf" inputmode="numeric" required>
  <label for="cmail">E-mail</label><input type="email" id="cmail" required>
  <p class="warn" id="cerr" role="alert"></p><button class="btn" type="submit">Consultar</button></form><div id="cres"></div>`;
  $("#cf").onsubmit=async ev=>{ev.preventDefault();
    const cpf=$("#ccpf").value.replace(/\D/g,""),mail=$("#cmail").value.trim(),err=$("#cerr"),res=$("#cres");
    res.innerHTML="";
    if(cpf.length!==11||!/.+@.+\..+/.test(mail)){err.textContent="Informe o CPF com 11 dígitos e o e-mail da inscrição.";return}
    if(!/^https:\/\/script\.google\.com\//.test(CONFIG.urlPlanilha)){err.textContent="Consulta ainda não configurada. Avise o organizador.";return}
    const btn=ev.target.querySelector("button[type=submit]");btn.disabled=true;btn.textContent="Consultando...";err.textContent="";
    let j;
    try{j=await (await fetch(CONFIG.urlPlanilha+"?acao=comprovante&cpf="+cpf+"&email="+encodeURIComponent(mail))).json()}
    catch(x){err.textContent="Não foi possível consultar. Verifique a internet e tente novamente.";btn.disabled=false;btn.textContent="Consultar";return}
    btn.disabled=false;btn.textContent="Consultar";
    if(!j.ok){err.textContent=j.erro||"Não foi possível consultar.";return}
    if(!j.itens.length){err.textContent="Nenhuma inscrição encontrada com esse CPF e e-mail.";return}
    res.innerHTML=j.itens.map(i=>{
      if(!i.pago){const m=encodeURIComponent(`Olá! Fiz a inscrição de ${i.nome} na ${i.evento} e gostaria de confirmar meu pagamento.`);
        return `<div class="box pend noprint"><h2>${esc(i.evento)}</h2><p>Inscrição encontrada, mas o pagamento <b>ainda não foi confirmado</b>. Se você já pagou, envie o comprovante do PIX para a organização.</p><a class="btn" target="_blank" rel="noopener" href="https://wa.me/${CONFIG.whatsapp}?text=${m}">Enviar comprovante no WhatsApp</a></div>`}
      const ev=EVENTOS.find(x=>x.nome===i.evento);
      return `<div class="box comp"><h2>Comprovante de inscrição</h2><p><b>Nº ${esc(i.numero)}</b> · Pagamento confirmado</p>
      <dl><dt>Evento</dt><dd>${esc(i.evento)}</dd>${ev?`<dt>Data</dt><dd>${dt(ev.data)}</dd>${ev.hora?`<dt>Largada</dt><dd>${esc(ev.hora)}</dd>`:""}<dt>Local</dt><dd>${esc(ev.local)}</dd>`:""}
      <dt>Participante</dt><dd>${esc(i.nome)}</dd><dt>CPF</dt><dd>***.${cpf.slice(3,6)}.${cpf.slice(6,9)}-**</dd>
      <dt>Categoria</dt><dd>${esc(i.categoria)}</dd><dt>Camisa</dt><dd>${esc(i.camisa)}</dd><dt>Pacote</dt><dd>${esc(i.pacote)}</dd>
      <dt>Valor pago</dt><dd>${brl(i.valor)}</dd><dt>Inscrição em</dt><dd>${esc(i.em)}</dd></dl>
      <p class="warn">${esc(CONFIG.nome)} · Guarde este comprovante.</p>
      <button class="btn noprint" onclick="print()">Baixar / imprimir (PDF)</button></div>`}).join("");
  };
}

function route(){clearInterval(window._t);const h=location.hash.slice(1);
  if(h.startsWith("evento/"))evento(h.slice(7));else if(h==="comprovante")comprovante();else home();}
addEventListener("hashchange",route);route();
</script>
</body>
</html>
